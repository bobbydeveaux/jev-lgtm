# Dogfood: review this repository's own pull requests with the action in this
# commit of main. pull_request_target runs the workflow from the base branch,
# so a pull request can't change the code that reviews it.
name: Jev LGTM

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: jev-lgtm-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: ./
        with:
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
