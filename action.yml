name: Jev LGTM
description: Asks Jev (TypeSafe AI) whether a pull request is LGTM or needs a human review.
author: Bobby DeVeaux
branding:
  icon: eye
  color: green

inputs:
  typesafe-api-key:
    description: TypeSafe API key. Store it as a repository secret.
    required: true
  github-token:
    description: Token used to read the pull request, comment, and review.
    default: ${{ github.token }}
  model:
    description: Jev model. Pinned by default so thresholds don't shift when a new version ships.
    default: jev-1.13.0
  approve:
    description: Approve the pull request on LGTM, and withdraw that approval if a later push needs review.
    default: "true"
  max-files:
    description: Pull requests changing more files than this are Review Advised without calling Jev.
    default: "50"
  max-changed-lines:
    description: Pull requests changing more lines (added plus deleted) than this are Review Advised without calling Jev.
    default: "1000"
  sensitive-paths:
    description: Extra glob patterns, one per line, that always need a human review.
    default: ""
  ignore-default-sensitive-paths:
    description: Drop the built-in sensitive paths (CI config, migrations, dependency manifests, keys).
    default: "false"
  risk-threshold:
    description: Risk score (0 to 3) at or above which a chunk needs review.
    default: "1.5"
  flag-threshold:
    description: Probability (0 to 1) at or above which a yes/no concern needs review.
    default: "0.5"
  min-confidence:
    description: A low-risk answer with confidence below this still needs review.
    default: "0.4"
  concurrency:
    description: Maximum Jev requests in flight at once.
    default: "8"

outputs:
  verdict:
    description: '"LGTM" or "Review Advised".'
  comment-url:
    description: URL of the report comment.

runs:
  using: node24
  main: dist/index.mjs
